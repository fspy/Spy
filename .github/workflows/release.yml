name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Spy.toc
        run: |
          set -euo pipefail
          version=$(grep -m1 '^## Version:' Spy.toc | cut -d' ' -f3 | tr -d '\r')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Spy.toc version v$version" >&2
            exit 1
          fi

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix=Spy/ -o "Spy-${version}.zip" HEAD
          cp "Spy-${version}.zip" Spy.zip
          unzip -l "Spy-${version}.zip" | head -20

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "Spy-${version}.zip" Spy.zip \
            --title "Spy (Forever) $version" \
            --generate-notes
